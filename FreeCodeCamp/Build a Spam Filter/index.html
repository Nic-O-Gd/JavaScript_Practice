<!DOCTYPE html>
<!-- Declares the document as HTML5 -->
<html lang="en">
  <head>
    <!-- Metadata about the document -->
    <meta charset="UTF-8" />
    <!-- Sets character encoding to UTF-8 -->
    <meta name="viewport" content="width=device-width" />
    <!-- Ensures proper rendering and touch zooming on mobile devices -->
    <title>Learn Regular Expressions by Building a Spam Filter</title>
    <!-- Title of the webpage shown in browser tab -->
    <link rel="stylesheet" href="./resources/css/styles.css" />
    <!-- Link to external CSS stylesheet for styling -->
  </head>

  <body>
    <!-- Main content of the webpage -->
    <header class="main-text">
      <!-- Header section with class for styling -->
      <h1 class="title">Is this Spam?</h1>
      <!-- Main heading of the page -->
      <p class="description">
        Enter a phrase to check if it would be marked as spam or not.
      </p>
      <!-- Description paragraph explaining the purpose -->
    </header>

    <main>
      <!-- Main section containing the input and button -->
      <label class="message-label" for="message-input">Message: </label>
      <!-- Label for the textarea input -->
      <textarea
        placeholder="Enter message here"
        value=""
        type="text"
        name="message"
        id="message-input"
        rows="10"
        cols="40"
      ></textarea>
      <!-- Textarea for user to input message, with placeholder and size attributes -->
      <button class="btn" id="check-message-btn" type="button">
        Check message
      </button>
      <!-- Button that triggers spam check -->
      <p id="result-message"></p>
      <!-- Paragraph to display result message -->
    </main>

    <footer class="footer">&copy; freeCodeCamp</footer>
    <!-- Footer section with copyright info -->
    <script src="./resources/javascript/main.js"></script>
    <!-- Link to external JavaScript file for functionality -->
  </body>
</html>
